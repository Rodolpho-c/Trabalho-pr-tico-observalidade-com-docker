version: '3.8'

services:
  if-bank:
    build: .
    container_name: if-bank-app
    ports:
      - "3001:3001"
    volumes:
      - ./dados_banco.json:/usr/src/app/dados_banco.json
    networks:
      - ifbank-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-app
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - ifbank-net
    depends_on:
      - if-bank

  loki:
    image: grafana/loki:latest
    container_name: loki-app
    ports:
      - "3101:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - ifbank-net

  promtail:
    image: grafana/promtail:latest
    container_name: promtail-app
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - ifbank-net
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-app
    ports:
      - "3002:3000"
    networks:
      - ifbank-net
    depends_on:
      - prometheus
      - loki

networks:
  ifbank-net:
    driver: bridge
